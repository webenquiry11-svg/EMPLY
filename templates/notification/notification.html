{% load basefilters %}
{% load static %}
{% load i18n %}
{% load notifications_tags %}
{% notifications_unread as unread_count %}

<div
    class="oh-navbar__notifications"
    id="notificationIcon"
    x-data="{open: false}"
    hx-get="{% url 'notifications' %}"
    hx-target="#notificationContainer"
>
    <a
        href="#"
        class="oh-navbar__notification-link"
        @click="open = !open"
        title="{% trans 'Notifications' %}"
    >
        <ion-icon
            name="notifications-outline"
            class="oh-navbar__icon"
        ></ion-icon>
        <span class="oh-navbar__notification-beacon">
            {% live_notify_badge %}
        </span>
    </a>

    <div
        id="showallnotificationbtn"
        class="oh-navbar__notification-tray"
        x-data="{markRead: false, visible: true}"
        x-show="open"
        style="display: none; position: absolute !important; right: -12px !important; bottom: calc(100% + 12px) !important; width: min(370px, calc(100vw - 34px)) !important; min-height: 360px !important; max-height: 620px !important; background: #ffffff !important; border: 1px solid rgba(42, 132, 155, 0.25) !important; border-radius: 20px !important; box-shadow: 0 24px 52px rgba(23, 109, 131, 0.18) !important; overflow: hidden !important; z-index: 2200 !important;"
        @click.outside="open = false"
    >
        <div id="notificationContainer">
            {% include 'notification/notification_items.html' %}
        </div>
        <div class="oh-navbar__notification-empty" x-show="!visible">
            <img
                src="{% static 'images/ui/happy.svg' %}"
                alt="{% trans 'All caught up' %}"
                width="50"
                height="50"
                loading="lazy"
            >
            <span class="oh-navbar__notification-empty-title">{% trans "All caught up!" %}</span>
            <span
                class="oh-navbar__notification-empty-desc"
            >{% trans "You have no new notifications at the moment." %}</span>
        </div>
    </div>
</div>

<div id="notificationConfig" data-notification-sound="{{ request.user.employee_get.notification_sound.sound_enabled|yesno:'true,false'|default:'false' }}" style="display:none"></div>

<script src="{% static 'notifications/notify.js' %}" type="text/javascript"></script>
