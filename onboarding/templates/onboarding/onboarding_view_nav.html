{% load i18n %}
<section class="oh-wrapper oh-main__topbar onboarding-head" x-data="{searchShow: false}">
    <div class="oh-main__titlebar oh-main__titlebar--left">
        <h1 class="oh-main__titlebar-title fw-bold">{% trans "Onboarding" %}</h1>
        <a
            class="oh-main__titlebar-search-toggle"
            role="button"
            aria-label="{% trans 'Toggle Search' %}"
            @click="searchShow = !searchShow"
        >
            <ion-icon name="search-outline" class="oh-main__titlebar-serach-icon"></ion-icon>
        </a>
    </div>
    <form action="" class="oh-main__titlebar oh-main__titlebar--right">
        <div class="oh-input-group oh-input__search-group" :class="searchShow ? 'oh-input__search-group--show' : ''">
            <ion-icon name="search-outline" class="oh-input-group__icon oh-input-group__icon--left"></ion-icon>
            <input
                type="text"
                value="{{request.GET.search_onboarding}}"
                onkeyup="setTimeout(() => {
                $(this).closest('form').submit()
            }, 1000)"
                name="search_onboarding"
                class="oh-input oh-input__icon"
                aria-label="{% trans 'Search Input' %}"
                placeholder="{% trans 'Search' %}"
            >
        </div>
        <ul class="oh-view-types onboarding-head__view-types ml-2" style="margin-bottom: 0">
            <li class="oh-view-type candidate-view-type" data-view="list" title='{% trans "List" %}'>
                <a
                    href="{% url 'onboarding-view' %}?{{request.GET.urlencode}}"
                    hx-target="#section"
                    class="oh-btn oh-btn--view {% if not card %}oh-btn--view-active{% endif %}"
                ><ion-icon
                        name="list-outline"
                        role="img"
                        class="md hydrated"
                        aria-label="{% trans 'list outline' %}"
                    ></ion-icon></a>
            </li>
            <li class="oh-view-type candidate-view-type" data-view="card" title='{% trans "Card" %}'>
                <a
                    href="{% url 'kanban-view' %}?{{request.GET.urlencode}}"
                    hx-target="#section"
                    class="oh-btn oh-btn--view {% if card %}oh-btn--view-active{% endif %}"
                ><ion-icon
                        name="grid-outline"
                        role="img"
                        class="md hydrated"
                        aria-label="{% trans 'grid outline' %}"
                    ></ion-icon></a>
            </li>
        </ul>
        <div class="oh-main__titlebar-button-container">
            <div class="oh-dropdown" x-data="{open: false}">
                <button type="button" class="oh-btn oh-btn--secondary onboarding-head__filter" @click="open = !open">
                    <span class="material-symbols-outlined" aria-hidden="true">filter_list</span>
                    <span>{% trans "Filter" %}</span>
                </button>
                <div
                    class="oh-dropdown__menu oh-dropdown__menu--right oh-dropdown__filter p-4"
                    x-show="open"
                    @click.outside="open = false"
                >
                    {% include "onboarding/filters.html" %}
                </div>
            </div>
        </div>
    </form>
</section>
{% include "filter_tags.html" %}
<div class="d-flex flex-row-reverse oh-wrapper onboarding-status-legend">
    <button
        type="button"
        class="onboarding-status-legend__item onboarding-status-legend__item--closed"
        onclick="$('[name=closed]').val('true'); $('[name=closed]').first().change(); $('.filterButton').click()"
    >
        <span class="oh-dot oh-dot--small me-1"></span>
        {% trans "Closed" %}
    </button>
    <button
        type="button"
        class="onboarding-status-legend__item onboarding-status-legend__item--open"
        onclick="$('[name=closed]').val('false');$('[name=closed]').first().change(); $('.filterButton').click()"
    >
        <span class="oh-dot oh-dot--small me-1"></span>
        {% trans "Open" %}
    </button>
</div>
