{% load i18n %}
<section class="oh-wrapper oh-main__topbar employee-policies-head" style="padding-bottom: 1rem">
    <style>
        .employee-policies-head {
            background: #ffffff;
            border: 1px solid #d6e9e6;
            border-radius: 20px;
            margin: 26px 28px 18px;
            padding: 20px 24px !important;
            box-shadow: 0 10px 26px rgba(29, 86, 79, .08);
        }
        .employee-policies-head .oh-main__titlebar-title {
            color: #174f4b;
        }
        .employee-policies-head * {
            color: #315244;
        }
        .employee-policies-head .oh-main__titlebar-title {
            color: #17241d !important;
        }
        .employee-policies-head .oh-input::placeholder {
            color: #849088;
        }
        .employee-policies-head .oh-input {
            border-color: #cfe2e0;
            border-radius: 12px;
            background: #f8fcfb;
            box-shadow: 0 4px 12px rgba(29, 86, 79, .05);
        }
        .employee-policies-head .oh-btn--secondary {
            background: linear-gradient(135deg, #155f6d, #238da0);
            border: 0;
            color: #fff;
            border-radius: 11px;
            box-shadow: 0 6px 14px rgba(21, 95, 109, .16);
        }
        .employee-policies-head .oh-btn--secondary:hover {
            background: linear-gradient(135deg, #0d5362, #167b8d);
            color: #fff;
            transform: translateY(-1px);
        }
        html body .oh-wrapper-main.super-admin-panel-theme .employee-policies-head {
            justify-content: space-between;
            gap: 24px;
            background: #ffffff !important;
            border-color: #b9dce4 !important;
            box-shadow: 0 10px 26px rgba(10, 77, 96, 0.12);
        }
        .oh-wrapper-main.super-admin-panel-theme .employee-policies-head .oh-main__titlebar--left,
        .oh-wrapper-main.super-admin-panel-theme .employee-policies-head .oh-main__titlebar-title {
            color: #173f50 !important;
        }
        .oh-wrapper-main.super-admin-panel-theme .employee-policies-head .oh-main__titlebar-title {
            font-size: 1rem !important;
            font-weight: 700 !important;
        }
        .oh-wrapper-main.super-admin-panel-theme .employee-policies-head .oh-main__titlebar--right {
            display: flex;
            flex: 0 1 auto;
            align-items: center;
            justify-content: flex-end;
            gap: 14px;
            margin: 0;
        }
        .oh-wrapper-main.super-admin-panel-theme .employee-policies-head .oh-input__search-group {
            display: flex;
            flex: 0 1 270px;
            align-items: center;
            min-width: 200px;
            margin: 0 !important;
            padding: 0;
            background: transparent !important;
            border: 0 !important;
            box-shadow: none !important;
        }
        .oh-wrapper-main.super-admin-panel-theme .employee-policies-head .oh-input {
            width: 100%;
            margin: 0 !important;
            background: #ffffff !important;
            border-color: #c7e5eb !important;
            color: #173f50 !important;
            box-shadow: none;
        }
        .oh-wrapper-main.super-admin-panel-theme .employee-policies-head .oh-input::placeholder {
            color: #557b84;
        }
        .oh-wrapper-main.super-admin-panel-theme .employee-policies-head .oh-input-group__icon {
            color: #176f80 !important;
        }
        .oh-wrapper-main.super-admin-panel-theme .employee-policies-head .oh-main__titlebar-button-container {
            margin: 0;
        }
        .oh-wrapper-main.super-admin-panel-theme .employee-policies-head .oh-btn--secondary {
            min-width: 120px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            background: linear-gradient(135deg, #0a596b, #177f91) !important;
            border-color: #176f80 !important;
            color: #ffffff !important;
        }
        .oh-wrapper-main.super-admin-panel-theme .employee-policies-head .oh-btn--secondary ion-icon {
            flex: 0 0 auto;
            color: #ffffff !important;
            font-size: 18px;
            line-height: 1;
        }
        .oh-wrapper-main.super-admin-panel-theme .employee-policies-head .oh-btn--secondary:hover {
            background: #0a4d60 !important;
            border-color: #0a4d60 !important;
        }
        @media (max-width: 640px) {
            .employee-policies-head {
                margin: 14px 12px 14px;
                padding: 16px !important;
            }
            .employee-policies-head .oh-main__titlebar--right {
                gap: 10px;
            }
            .employee-policies-head .oh-input__search-group,
            .employee-policies-head .oh-input,
            .employee-policies-head .oh-main__titlebar-button-container,
            .employee-policies-head .oh-btn {
                width: 100%;
                margin-right: 0 !important;
            }
            .oh-wrapper-main.super-admin-panel-theme .employee-policies-head .oh-main__titlebar--right {
                width: 100%;
                align-items: stretch;
            }
            .oh-wrapper-main.super-admin-panel-theme .employee-policies-head .oh-input__search-group {
                flex-basis: 100%;
                min-width: 0;
            }
        }
    </style>
    <div class="oh-main__titlebar oh-main__titlebar--left oh-d-flex-column--resp oh-mb-3--small">
        <h1 class="oh-main__titlebar-title fw-bold">{% trans 'Policies' %}</h1>
    </div>

    <div class="oh-main__titlebar oh-main__titlebar--right oh-d-flex-column--resp oh-mb-3--small">
        <div class="oh-input-group oh-input__search-group mr-4">
            <ion-icon
                name="search-outline"
                class="oh-input-group__icon oh-input-group__icon--left md hydrated"
                role="img"
                aria-label="{% trans 'search outline' %}"
            ></ion-icon>
            <input
                hx-get="{% url 'search-policies' %}"
                name="search"
                hx-trigger="keyup changed delay:.2s"
                hx-target="#policyContainer"
                type="text"
                placeholder="{% trans 'Search' %}"
                style="margin-right: 10px"
                class="oh-input oh-input__icon mr-3"
                autocomplete="false"
                aria-label="{% trans 'Search Input' %}"
            >
        </div>
        {% include 'policies/filter.html' %}
        {% if perms.employee.add_policy %}
            <div class="oh-main__titlebar-button-container">
                <div class="oh-main__titlebar-button-container">
                    <a
                        hx-get="{% url 'create-policy' %}"
                        hx-target="#objectCreateModalTarget"
                        data-toggle="oh-modal-toggle"
                        data-target="#objectCreateModal"
                        class="oh-btn oh-btn--secondary"
                    >
                        <ion-icon name="add-outline"></ion-icon>
                        {% trans 'Create' %}
                    </a>
                </div>
            </div>
        {% endif %}
    </div>
</section>
