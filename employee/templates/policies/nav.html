{% load i18n %}
<style>
    .policy-nav {
        display: flex;
        align-items: center;
        gap: 16px;
        width: 100%;
        max-width: 95%;
        min-height: 68px;
        box-sizing: border-box;
        margin: 24px auto 16px;
        padding: 0 26px 0 28px;
        position: relative;
        overflow: visible;
        flex-wrap: wrap;
        z-index: 30;
        background: #ffffff;
        border: 1px solid #dce9e2;
        border-radius: 20px;
        box-shadow: 0 2px 8px rgba(18, 60, 40, 0.04), 0 10px 28px rgba(18, 60, 40, 0.07);
    }
    .policy-nav::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, #1f7a5c 0%, #38a97b 55%, #8dcfb0 100%) top / 100% 3px no-repeat;
        border-radius: inherit;
        pointer-events: none;
    }
    .policy-nav__title-block {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-shrink: 0;
    }
    .policy-nav__icon {
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        flex-shrink: 0;
        border: 1px solid rgba(31, 122, 92, 0.14);
        border-radius: 12px;
        background: linear-gradient(135deg, #e8f5ef, #d0eddf);
    }
    .policy-nav__icon ion-icon {
        color: #1f7a5c !important;
        font-size: 20px;
    }
    .policy-nav__title {
        margin: 0;
        color: #0f2d1e !important;
        font-size: 1.2rem;
        font-weight: 800;
        letter-spacing: -0.01em;
        white-space: nowrap;
    }
    .policy-nav__spacer { flex: 1; }
    .policy-nav__controls {
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .policy-nav .oh-dropdown {
        position: relative;
        z-index: 31;
    }
    .policy-nav .oh-dropdown__filter,
    .policy-nav .oh-dropdown__menu {
        z-index: 40;
        width: min(560px, calc(100vw - 32px));
        max-height: min(75vh, 680px);
        overflow-y: auto;
        border: 1px solid #dce9e2;
        border-radius: 16px;
        box-shadow: 0 18px 44px rgba(18, 60, 40, 0.16);
    }
    .policy-nav .oh-dropdown > .oh-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        height: 38px;
        box-sizing: border-box;
        margin: 0 !important;
        padding: 0 14px;
        border: 1.5px solid #d3e5db;
        border-radius: 10px;
        background: #f6fbf8;
        color: #2e6649 !important;
        font-size: 0.82rem;
        font-weight: 700;
        box-shadow: none;
        transition: background 0.15s, border-color 0.15s;
    }
    .policy-nav .oh-dropdown > .oh-btn ion-icon {
        color: #2e6649 !important;
        font-size: 15px;
    }
    .policy-nav .oh-dropdown > .oh-btn:hover {
        border-color: #b0d4c1;
        background: #e4f3eb;
    }
    .policy-nav__search-wrap {
        position: relative;
        display: flex;
        align-items: center;
    }
    .policy-nav__search-wrap ion-icon {
        position: absolute;
        left: 11px;
        color: #7a9e8b !important;
        font-size: 15px;
        pointer-events: none;
    }
    .policy-nav__search {
        width: 220px;
        height: 38px;
        box-sizing: border-box;
        padding: 0 12px 0 34px;
        border: 1.5px solid #d3e5db;
        border-radius: 10px;
        outline: none;
        background: #f6fbf8;
        color: #1b3a28;
        font-size: 0.83rem;
        transition: border-color 0.16s, box-shadow 0.16s;
    }
    .policy-nav__search::placeholder { color: #9db8a9; }
    .policy-nav__search:focus {
        border-color: #38a97b;
        background: #ffffff;
        box-shadow: 0 0 0 3px rgba(56, 169, 123, 0.1);
    }
    .policy-nav__create {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        height: 38px;
        box-sizing: border-box;
        padding: 0 14px;
        border: 1px solid transparent;
        border-radius: 10px;
        background: linear-gradient(135deg, #1f7a5c, #28936e);
        color: #ffffff !important;
        font-size: 0.82rem;
        font-weight: 700;
        text-decoration: none !important;
        white-space: nowrap;
        box-shadow: 0 4px 12px rgba(31, 122, 92, 0.24);
        transition: opacity 0.15s, box-shadow 0.15s;
    }
    .policy-nav__create ion-icon {
        color: #ffffff !important;
        font-size: 15px;
    }
    .policy-nav__create:hover,
    .policy-nav__create:focus,
    .policy-nav__create:focus-visible {
        color: #ffffff !important;
        text-decoration: none !important;
    }
    .policy-nav__create:hover {
        opacity: 0.9;
        box-shadow: 0 6px 16px rgba(31, 122, 92, 0.32);
    }
    body:has(#policyContainer) .policy-nav {
        border-color: rgba(42, 132, 155, 0.2);
        box-shadow: 0 2px 8px rgba(10, 77, 96, 0.04), 0 10px 28px rgba(10, 77, 96, 0.08);
    }
    body:has(#policyContainer) .policy-nav::before {
        background-image: linear-gradient(90deg, #0a4d60 0%, #278da0 55%, #b8dfe6 100%);
    }
    body:has(#policyContainer) .policy-nav__icon {
        border-color: rgba(39, 141, 160, 0.2);
        background: linear-gradient(135deg, #e8f5f7, #d8edf1);
    }
    body:has(#policyContainer) .policy-nav__icon ion-icon {
        color: #176d83 !important;
    }
    body:has(#policyContainer) .policy-nav__title {
        color: #173f50 !important;
    }
    body:has(#policyContainer) .policy-nav .oh-dropdown > .oh-btn {
        border-color: rgba(39, 141, 160, 0.28);
        background: linear-gradient(110deg, #0a4d60, #278da0);
        color: #ffffff !important;
        box-shadow: 0 5px 12px rgba(10, 77, 96, 0.16);
    }
    body:has(#policyContainer) .policy-nav .oh-dropdown > .oh-btn ion-icon {
        color: #ffffff !important;
    }
    body:has(#policyContainer) .policy-nav .oh-dropdown > .oh-btn:hover {
        border-color: #0a4d60;
        background: linear-gradient(110deg, #083f50, #176d83);
    }
    body:has(#policyContainer) .policy-nav__search {
        border-color: rgba(39, 141, 160, 0.28);
        background: #f6fbfc;
        color: #173f50;
    }
    body:has(#policyContainer) .policy-nav__search:focus {
        border-color: #278da0;
        box-shadow: 0 0 0 3px rgba(39, 141, 160, 0.12);
    }
    body:has(#policyContainer) .policy-nav__create {
        background: linear-gradient(110deg, #0a4d60, #278da0);
        box-shadow: 0 5px 12px rgba(10, 77, 96, 0.16);
    }
    @media (max-width: 768px) {
        .policy-nav {
            width: 100%;
            max-width: 100%;
            min-height: auto;
            margin: 0 auto 12px;
            padding: 14px 16px;
            gap: 10px;
        }
        .policy-nav__controls {
            width: 100%;
            justify-content: flex-end;
        }
        .policy-nav__search-wrap,
        .policy-nav__search {
            width: 100%;
        }
        .policy-nav__controls {
            flex-wrap: wrap;
        }
    }
</style>

<section class="policy-nav">
    <div class="policy-nav__title-block">
        <div class="policy-nav__icon"><ion-icon name="document-text-outline"></ion-icon></div>
        <h1 class="policy-nav__title">{% trans "Policies" %}</h1>
    </div>
    <div class="policy-nav__spacer"></div>
    <div class="policy-nav__controls">
        <label class="policy-nav__search-wrap">
            <ion-icon name="search-outline" aria-hidden="true"></ion-icon>
            <input
                hx-get="{% url 'search-policies' %}"
                name="search"
                hx-trigger="keyup changed delay:.2s"
                hx-target="#policyContainer"
                type="search"
                placeholder="{% trans 'Search' %}"
                class="policy-nav__search"
                autocomplete="off"
                aria-label="{% trans 'Search policies' %}"
            >
        </label>
        {% include 'policies/filter.html' %}
        {% if perms.employee.add_policy %}
            <a
                hx-get="{% url 'create-policy' %}"
                hx-target="#objectCreateModalTarget"
                data-toggle="oh-modal-toggle"
                data-target="#objectCreateModal"
                class="policy-nav__create"
            >
                <ion-icon name="add-outline" aria-hidden="true"></ion-icon>
                {% trans "Create" %}
            </a>
        {% endif %}
    </div>
</section>
