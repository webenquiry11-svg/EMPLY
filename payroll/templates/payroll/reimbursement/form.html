{% load i18n %}
<style>
    .reimbursement-form-modal {
        --reimbursement-ink: #073f47;
        --reimbursement-teal: #0b7b89;
        --reimbursement-teal-dark: #075c69;
        --reimbursement-border: #d7e9ed;
        --reimbursement-surface: #f5fafb;
    }

    .oh-modal__dialog:has(.reimbursement-form-modal) {
        max-width: 820px;
        overflow: hidden;
        border-radius: 18px;
        box-shadow: 0 24px 70px rgba(4, 54, 61, 0.25);
    }

    .reimbursement-form-modal .oh-modal__dialog-header {
        display: flex;
        align-items: center;
        min-height: 78px;
        padding: 1.25rem 1.75rem;
        color: #fff;
        background: linear-gradient(120deg, var(--reimbursement-teal-dark), #278da0);
    }

    .reimbursement-form-modal .oh-modal__dialog-header::before {
        content: "{% trans 'Reimbursement / Encashment' %}";
        font-size: 1.2rem;
        font-weight: 700;
        letter-spacing: 0.01em;
    }

    .reimbursement-form-modal .oh-modal__close {
        top: 50%;
        right: 1.5rem;
        display: grid;
        width: 36px;
        height: 36px;
        place-items: center;
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.14);
        opacity: 1;
        transform: translateY(-50%);
    }

    .reimbursement-form-modal .oh-modal__close:hover {
        background: rgba(255, 255, 255, 0.25);
    }

    .reimbursement-form-modal .oh-modal__dialog-body {
        padding: 1.25rem 1.5rem 1.5rem;
        background: var(--reimbursement-surface);
    }

    .reimbursement-form-modal .oh-general__tab-target {
        padding: 0;
    }

    .reimbursement-form-modal .oh-payslip__header {
        display: none;
    }

    .reimbursement-form-modal .oh-profile-section__card {
        padding: 1.25rem;
        border: 1px solid var(--reimbursement-border);
        border-radius: 14px;
        background: #fff;
        box-shadow: 0 8px 24px rgba(10, 77, 96, 0.06);
    }

    .reimbursement-form-modal .oh-profile-section__card > .row {
        row-gap: 1rem;
    }

    .reimbursement-form-modal .oh-profile-section__card > .row > [id$="_parent_div"] {
        min-width: 0;
    }

    .reimbursement-form-modal .oh-label__info {
        margin-bottom: 0.4rem;
    }

    .reimbursement-form-modal .oh-label,
    .reimbursement-form-modal .oh-label__info label {
        margin: 0;
        color: var(--reimbursement-ink);
        font-size: 0.82rem;
        font-weight: 700;
    }

    .reimbursement-form-modal .form-control,
    .reimbursement-form-modal .oh-profile-section__card select,
    .reimbursement-form-modal .oh-profile-section__card textarea {
        min-height: 46px;
        padding: 0.7rem 0.8rem;
        color: #31535a;
        border: 1px solid var(--reimbursement-border);
        border-radius: 10px;
        background: #fff;
        box-shadow: none;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .reimbursement-form-modal .form-control:focus,
    .reimbursement-form-modal .oh-profile-section__card select:focus,
    .reimbursement-form-modal .oh-profile-section__card textarea:focus {
        border-color: var(--reimbursement-teal);
        box-shadow: 0 0 0 3px rgba(11, 123, 137, 0.12);
        outline: none;
    }

    .reimbursement-form-modal .oh-profile-section__card textarea {
        min-height: 96px;
        resize: vertical;
    }

    .reimbursement-form-modal .oh-profile-section__card input[type="file"] {
        height: 46px;
        padding: 0.45rem;
    }

    .reimbursement-form-modal .oh-profile-section__card input[type="file"]::file-selector-button {
        height: 36px;
        margin-right: 0.6rem;
        padding: 0 0.85rem;
        color: var(--reimbursement-teal-dark);
        border: 1px solid #bde0e6;
        border-radius: 8px;
        background: #edf8fa;
        cursor: pointer;
    }

    .reimbursement-form-modal .oh-switch {
        min-height: 46px;
        display: flex;
        align-items: center;
    }

    .reimbursement-form-modal .oh-switch__checkbox {
        accent-color: var(--reimbursement-teal);
    }

    .reimbursement-form-modal .oh-profile-section__card .d-flex.flex-row-reverse {
        margin-top: 1.35rem;
        padding-top: 1.1rem;
        border-top: 1px solid var(--reimbursement-border);
    }

    .reimbursement-form-modal .oh-profile-section__card .oh-btn--secondary {
        min-width: 120px;
        min-height: 46px;
        margin: 0 !important;
        border: 0;
        border-radius: 10px;
        background: linear-gradient(110deg, var(--reimbursement-teal-dark), #278da0);
        box-shadow: 0 8px 18px rgba(7, 92, 105, 0.2);
    }

    .reimbursement-form-modal .oh-profile-section__card .oh-btn--secondary:hover {
        background: linear-gradient(110deg, #064c58, var(--reimbursement-teal));
    }

    .reimbursement-form-modal #availableTable {
        margin: 0 1.5rem 1.5rem;
        border: 1px solid var(--reimbursement-border);
        border-radius: 10px;
        overflow: hidden;
    }

    @media (max-width: 640px) {
        .oh-modal__dialog:has(.reimbursement-form-modal) {
            width: calc(100% - 1.25rem);
            margin: 0.75rem auto;
        }

        .reimbursement-form-modal .oh-modal__dialog-body {
            padding: 1rem;
        }

        .reimbursement-form-modal .oh-profile-section__card {
            padding: 0.9rem;
        }
    }
</style>
<div class="reimbursement-form-modal">
<div class="oh-modal__dialog-header">
    <button type="button" class="oh-modal__close" aria-label="{% trans 'Close' %}">
        <ion-icon name="close-outline"></ion-icon>
    </button>
</div>

<!-- htmx form -->
<div class="oh-modal__dialog-body">
    <form
        hx-post="{% url 'create-reimbursement' %}?{% if form.instance.id %}instance_id={{form.instance.id}}{% endif %}"
        hx-target="#objectCreateModalTarget"
        hx-encoding="multipart/form-data"
    >
        {{ form.as_p }}
    </form>
    <table
        class="oh-table oh-table--sortable"
        {% if not form.instance.id or form.instance.type == "reimbursement" or form.instance.type == "bonus_encashment" %}
            id="availableTable"
            style="display: none"
        {% endif %}
    >
        <thead>
            <tr>
                <th>{% trans "Leave Type" %}</th>
                <th>{% trans "Available Days" %}</th>
                <th title=" {% trans 'Carry Forward Days' %}">{% trans "CFD" %}</th>
            </tr>
        </thead>
        <tbody {% if not form.instance.id %}id="availableTableBody"{% endif %}>
            {% for available_leave in form.assigned_leaves %}
                <tr class="toggle-highlight">
                    <td>{{ available_leave.leave_type_id }}</td>
                    <td>{{ available_leave.available_days }}</td>
                    <td>{{ available_leave.carryforward_days }}</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
    <script>
        toggleReimbursmentType($("#objectCreateModalTarget [name=type]").first());
        removeHighlight();
        var attachemntLabelElement = $(
            "#objectCreateModalTarget [for=id_attachment]"
        );
        var attachemntlElement = $("#objectCreateModalTarget #id_attachment");
        var attachemntParentlElement = $(
            "#objectCreateModalTarget [for=id_attachment]"
        ).parent();

        // Detach both elements from the DOM
        attachemntLabelElement.detach();
        attachemntlElement.detach();
        attachemntParentlElement.html("");
        // Append them in the desired order
        attachemntParentlElement.append(attachemntLabelElement);
        attachemntParentlElement.append(attachemntlElement);
    </script>
</div>
</div>
