{% load i18n %}
{% load tz %}
<div class="viewed-by-list">
    {% for instance in viewed_by %}
        <div class="viewed-by-row">
            <div class="viewed-by-row__avatar">
                <img src="{{ instance.user.employee_get.get_avatar }}" alt="" loading="lazy">
            </div>
            <div class="viewed-by-row__person">
                <span class="viewed-by-row__name">{{ instance.user.employee_get }}</span>
                <time class="viewed-by-row__date" datetime="{{ instance.created_at|date:'c' }}">
                    {{ instance.created_at|localtime|date:"M j, Y, g:i a" }}
                </time>
            </div>
        </div>
    {% empty %}
        <p class="viewed-by-list__empty">{% trans "No views yet." %}</p>
    {% endfor %}
</div>
