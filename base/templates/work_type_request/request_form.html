{% load i18n %}
<style>
    #objectCreateModal:has(#workTypeRequestForm),
    #objectUpdateModal:has(#workTypeRequestForm) {
        align-items: center !important;
        justify-content: center !important;
        padding: 16px !important;
        background: rgba(7, 20, 23, 0.62) !important;
        backdrop-filter: blur(6px);
    }

    #objectCreateModal:has(#workTypeRequestForm) > #objectCreateModalTarget,
    #objectUpdateModal:has(#workTypeRequestForm) > #objectUpdateModalTarget {
        width: min(680px, calc(100vw - 32px)) !important;
        max-width: 680px !important;
        max-height: min(82vh, 680px) !important;
        overflow: hidden;
        border: 1px solid rgba(201, 224, 229, 0.9) !important;
        border-radius: 22px !important;
        box-shadow: 0 24px 64px rgba(10, 46, 54, 0.3) !important;
        animation: work-type-request-enter 240ms cubic-bezier(0.2, 0.75, 0.25, 1) both;
    }

    @keyframes work-type-request-enter {
        from { opacity: 0; transform: translateY(28px); }
        to { opacity: 1; transform: translateY(0); }
    }

    #objectCreateModal:has(#workTypeRequestForm) .oh-modal__dialog-header,
    #objectUpdateModal:has(#workTypeRequestForm) .oh-modal__dialog-header {
        display: flex;
        align-items: center;
        min-height: 62px !important;
        padding: 0.75rem 1.1rem !important;
        gap: 1rem;
        border: 0 !important;
        background: linear-gradient(115deg, #0a4d60 0%, #176f80 58%, #278da0 100%) !important;
    }

    .work-type-request-heading {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        min-width: 0;
    }

    .work-type-request-heading__icon {
        display: inline-flex;
        flex: 0 0 38px;
        align-items: center;
        justify-content: center;
        width: 38px;
        height: 38px;
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.14);
        color: #fff;
        font-size: 21px;
    }

    .work-type-request-heading__copy { min-width: 0; }

    #objectCreateModal:has(#workTypeRequestForm) .oh-modal__dialog-title,
    #objectUpdateModal:has(#workTypeRequestForm) .oh-modal__dialog-title {
        margin: 0;
        color: #fff !important;
        font-size: 1.1rem;
        font-weight: 800;
    }

    #objectCreateModal:has(#workTypeRequestForm) .work-type-request-subtitle,
    #objectUpdateModal:has(#workTypeRequestForm) .work-type-request-subtitle {
        display: block !important;
        margin: 0.12rem 0 0;
        color: #d9f4f7 !important;
        font-size: 0.76rem !important;
        font-weight: 500 !important;
        line-height: 1.4 !important;
        opacity: 1 !important;
        visibility: visible !important;
    }

    #objectCreateModal:has(#workTypeRequestForm) .oh-modal__close,
    #objectUpdateModal:has(#workTypeRequestForm) .oh-modal__close {
        position: relative !important;
        top: auto !important;
        right: auto !important;
        display: inline-flex !important;
        flex: 0 0 36px;
        align-items: center !important;
        justify-content: center !important;
        width: 36px !important;
        height: 36px !important;
        margin: 0 0 0 auto !important;
        padding: 0 !important;
        transform: none !important;
        border-radius: 50% !important;
    }

    #objectCreateModal:has(#workTypeRequestForm) .oh-modal__close ion-icon,
    #objectUpdateModal:has(#workTypeRequestForm) .oh-modal__close ion-icon {
        display: block;
        width: 18px;
        height: 18px;
        margin: 0;
        font-size: 18px;
        line-height: 0;
    }

    #objectCreateModal:has(#workTypeRequestForm) .oh-modal__dialog-body,
    #objectUpdateModal:has(#workTypeRequestForm) .oh-modal__dialog-body {
        max-height: calc(82vh - 62px);
        overflow-y: auto;
        padding: 1.1rem !important;
        background: linear-gradient(145deg, #edf7f8 0%, #f7fbfa 68%, #eef6f3 100%) !important;
    }

    #workTypeRequestForm {
        margin: 0 !important;
        padding: 0 !important;
        color: #173f50 !important;
    }

    #workTypeRequestForm > .oh-general__tab-target#personal {
        width: 100% !important;
        min-height: 0 !important;
        margin: 0 !important;
        padding: 0 !important;
        border: 0 !important;
        background: transparent !important;
        box-shadow: none !important;
    }

    #workTypeRequestForm .oh-profile-section__card {
        padding: 1rem !important;
        border: 1px solid #dcebed !important;
        border-radius: 16px !important;
        background: rgba(255, 255, 255, 0.94) !important;
        box-shadow: 0 8px 24px rgba(23, 63, 80, 0.07) !important;
    }

    #workTypeRequestForm .row {
        display: grid !important;
        grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
        gap: 0.85rem 1rem !important;
        width: 100% !important;
        margin: 0 !important;
    }

    #workTypeRequestForm .row > .col-12:first-child {
        grid-column: 1 / -1 !important;
    }

    #workTypeRequestForm .row > .col,
    #workTypeRequestForm .row > [class*="col-"] {
        width: auto !important;
        max-width: none !important;
        padding: 0 !important;
    }

    #workTypeRequestForm .row > .oh-label__info,
    #workTypeRequestForm .row > div[style*="width: 100%"] {
        grid-column: 1 / -1 !important;
        min-width: 0;
        padding: 0 !important;
    }

    #workTypeRequestForm label {
        display: block;
        margin-bottom: 0.35rem;
        color: #24515e;
        font-size: 0.78rem;
        font-weight: 800;
    }

    #workTypeRequestForm input:not([type="checkbox"]),
    #workTypeRequestForm select,
    #workTypeRequestForm textarea,
    #workTypeRequestForm .select2-selection {
        width: 100% !important;
        min-width: 0 !important;
        min-height: 40px !important;
        box-sizing: border-box;
        padding: 0.45rem 0.7rem !important;
        border: 1px solid #cfe1e5 !important;
        border-radius: 11px !important;
        background: #fff !important;
        color: #285d6b !important;
        font-size: 0.84rem;
        box-shadow: 0 1px 2px rgba(23, 63, 80, 0.04);
        transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    #workTypeRequestForm input:not([type="checkbox"]):focus,
    #workTypeRequestForm select:focus,
    #workTypeRequestForm textarea:focus,
    #workTypeRequestForm .select2-container--focus .select2-selection {
        outline: 0;
        border-color: #278da0 !important;
        box-shadow: 0 0 0 3px rgba(39, 141, 160, 0.15) !important;
    }

    #workTypeRequestForm .select2-selection--single { height: 40px !important; }
    #workTypeRequestForm .select2-selection__rendered { line-height: 1.3 !important; }
    #workTypeRequestForm .select2-selection__arrow { height: 38px !important; }

    #workTypeRequestForm textarea {
        min-height: 64px !important;
        height: 64px !important;
        resize: vertical;
    }

    #workTypeRequestForm .oh-switch {
        display: flex;
        align-items: center;
        width: auto !important;
        min-height: 40px;
    }

    #workTypeRequestForm input[type="checkbox"].oh-switch__checkbox {
        position: relative;
        width: 44px !important;
        min-width: 44px !important;
        height: 24px !important;
        min-height: 24px !important;
        margin: 0;
        appearance: none !important;
        border: 1px solid #87b8c2 !important;
        border-radius: 999px !important;
        background-color: #d9eef2 !important;
        background-image: none !important;
        box-shadow: none !important;
        cursor: pointer;
        transition: background-color 160ms ease, border-color 160ms ease;
    }

    #workTypeRequestForm input[type="checkbox"].oh-switch__checkbox::before {
        content: none !important;
    }

    #workTypeRequestForm input[type="checkbox"].oh-switch__checkbox::after {
        position: absolute;
        top: 3px;
        left: 3px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background-color: #176f80 !important;
        box-shadow: 0 1px 3px rgba(10, 46, 54, 0.24);
        content: "";
        transition: left 160ms ease, background-color 160ms ease;
    }

    #workTypeRequestForm .oh-switch.is-checked .oh-switch__checkbox,
    #workTypeRequestForm input[type="checkbox"].oh-switch__checkbox:checked {
        border-color: #0a4d60 !important;
        background-color: #278da0 !important;
        background-image: none !important;
        box-shadow: 0 0 0 2px rgba(39, 141, 160, 0.18) !important;
        accent-color: #278da0 !important;
    }

    #workTypeRequestForm .oh-switch.is-checked .oh-switch__checkbox::after,
    #workTypeRequestForm input[type="checkbox"].oh-switch__checkbox:checked::after {
        left: 23px !important;
        background-color: #ffffff !important;
    }

    #workTypeRequestForm .oh-switch.is-checked .oh-switch__checkbox:hover,
    #workTypeRequestForm input[type="checkbox"].oh-switch__checkbox:checked:hover {
        background-color: #176f80 !important;
    }

    #workTypeRequestForm .oh-modal__dialog-footer {
        display: flex;
        justify-content: flex-end;
        margin-top: 0.9rem !important;
        padding: 0 !important;
    }

    #workTypeRequestForm .oh-modal__dialog-footer .oh-btn {
        min-width: 112px;
        min-height: 44px;
        padding: 0.65rem 1.25rem;
        border: 1px solid #176d83 !important;
        border-radius: 11px !important;
        background: linear-gradient(110deg, #0a4d60, #278da0) !important;
        color: #fff !important;
        font-weight: 800;
        box-shadow: 0 7px 16px rgba(10, 77, 96, 0.2);
    }

    #workTypeRequestForm .errorlist {
        margin: 0.3rem 0 0;
        padding-left: 1rem;
        color: #b54747;
        font-size: 0.76rem;
    }

    @media (max-width: 640px) {
        #objectCreateModal:has(#workTypeRequestForm),
        #objectUpdateModal:has(#workTypeRequestForm) {
            padding: 8px !important;
        }

        #objectCreateModal:has(#workTypeRequestForm) > #objectCreateModalTarget,
        #objectUpdateModal:has(#workTypeRequestForm) > #objectUpdateModalTarget {
            width: calc(100vw - 16px) !important;
            max-height: 88vh !important;
            border-radius: 18px !important;
        }

        #objectCreateModal:has(#workTypeRequestForm) .oh-modal__dialog-body,
        #objectUpdateModal:has(#workTypeRequestForm) .oh-modal__dialog-body {
            max-height: calc(88vh - 62px);
            padding: 0.8rem !important;
        }

        #workTypeRequestForm .row {
            grid-template-columns: minmax(0, 1fr) !important;
            gap: 0.8rem !important;
        }

        #workTypeRequestForm .row > .oh-label__info,
        #workTypeRequestForm .row > div[style*="width: 100%"] {
            grid-column: 1 !important;
        }
    }
</style>
{% if messages %}
    <script>
        setTimeout(function () {
            reloadMessage();
            $(".oh-modal__close").click();
        }, 1000);
    </script>
    {% if close_hx_url %}
        <span hx-get="{{close_hx_url}}" hx-target="{{close_hx_target}}" hx-trigger="load"></span>
    {% endif %}
{% endif %}
<div class="oh-modal__dialog-header">
    <div class="work-type-request-heading">
        <span class="material-symbols-outlined work-type-request-heading__icon" aria-hidden="true">work_history</span>
        <div class="work-type-request-heading__copy">
            <h2 class="oh-modal__dialog-title" id="objectCreateModalLabel">{{ form.verbose_name }}</h2>
            <p class="work-type-request-subtitle">{% trans "Share the details of your work type request below." %}</p>
        </div>
    </div>
    <button class="oh-modal__close" aria-label="{% trans 'Close' %}">
        <ion-icon name="close-outline"></ion-icon>
    </button>
</div>
<div class="oh-modal__dialog-body" id="formBody">
    <form
        hx-post="{{ request.get_full_path }}"
        hx-target=" {% if form.instance.id %} #objectUpdateModalTarget {% else %} #objectCreateModalTarget {% endif %}"
        id="workTypeRequestForm"
    >
        {{ form.as_p }}
    </form>
</div>
<script>
    function toggleFunctionWorkTypeRequestForm() {
        var permanentRequest = $("#id_is_permanent_work_type");
        var isPermanent = permanentRequest.is(":checked");
        permanentRequest.closest(".oh-switch").toggleClass("is-checked", isPermanent);

        if (isPermanent) {
            $("#id_requested_till").parent().hide();
        } else {
            $("#id_requested_till").parent().show();
        }
    }

    $(document).ready(function () {
        $("#workTypeRequestForm [type=checkbox]").change(function () {
            toggleFunctionWorkTypeRequestForm();
        });
    });
    toggleFunctionWorkTypeRequestForm();
</script>
