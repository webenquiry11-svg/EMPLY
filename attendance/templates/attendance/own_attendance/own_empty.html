{% extends 'index.html' %}{% block content %}
    {% load static %}
    {% load i18n %}
    <section class="oh-wrapper oh-main__topbar">
        <div class="oh-main__titlebar oh-main__titlebar--left">
            <h1 class="oh-main__titlebar-title fw-bold">{% trans "My Attendances" %}</h1>
        </div>
    </section>

    <div class="oh-wrapper">
        <div class="oh-empty">
            <img
                src="{% static 'images/ui/no_records.svg' %}"
                class="oh-404__image"
                alt="{% trans 'Page not found. 404.' %}"
            >
            <h2 class="oh-empty__title">{% trans "No Records found." %}</h2>
            <p class="oh-empty__subtitle">{% trans "There are no attendance records to display." %}</p>
        </div>
    </div>
{% endblock %}
