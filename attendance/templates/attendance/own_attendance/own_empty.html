{% extends 'index.html' %}{% block content %}
    {% load static %}
    {% load i18n %}
    <style>
        .employee-attendance-page { min-height: calc(100vh - 2px); padding: 28px 32px 120px; background: #f5f7f3; color: #123d2c; }
        .employee-attendance-page .oh-main__titlebar-title { color: #123d2c !important; font-weight: 800; }
        .employee-attendance-content { width: 100%; max-width: none; margin: 0; }
    </style>
    <div class="employee-attendance-page">
    <section class="oh-wrapper oh-main__topbar">
        <div class="oh-main__titlebar oh-main__titlebar--left">
            <h1 class="oh-main__titlebar-title fw-bold">{% trans "My Attendances" %}</h1>
        </div>
    </section>

    <div class="oh-wrapper employee-attendance-content">
        <div class="oh-empty">
            <img
                src="{% static 'images/ui/no_records.svg' %}"
                class="oh-404__image"
                alt="{% trans 'Page not found. 404.' %}"
            >
            <h2 class="oh-empty__title">{% trans "No Records found." %}</h2>
            <p class="oh-empty__subtitle">{% trans "There are no attendance records to display." %}</p>
        </div>
    </div>
    </div>
{% endblock %}
