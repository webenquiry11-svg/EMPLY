{% extends 'index.html' %} {% block content %} {% load i18n %}

<style>
    .work-record-page {
        --emp-bg: #0d140e;
        --emp-surface: #161f18;
        --emp-surface-elevated: rgba(22, 31, 24, 0.9);
        --emp-border: rgba(255, 255, 255, 0.08);
        --emp-text: #ffffff;
        --emp-muted: #8c9e90;
        --emp-green: #2d5a3f;
        --emp-green-soft: rgba(45, 90, 63, 0.2);
        --emp-light-green: #d1e7dd;
    }

    .work-record-page .oh-wrapper,
    .work-record-page .oh-card,
    .work-record-page #workRecordTable,
    .work-record-page table,
    .work-record-page th,
    .work-record-page td,
    .work-record-page .oh-dropdown__menu,
    .work-record-page .oh-btn,
    .work-record-page input,
    .work-record-page select {
        background: var(--emp-surface);
        color: var(--emp-text);
        border-color: var(--emp-border);
    }

    .work-record-page table {
        width: 100%;
        border-collapse: collapse;
    }

    .work-record-page th,
    .work-record-page td {
        border: 1px solid var(--emp-border);
        padding: 5px;
    }

    .work-record-page th,
    .work-record-page .header {
        background: #1d2a22;
        color: var(--emp-light-green);
        font-weight: 700;
    }

    .work-record-page .holiday {
        background: rgba(255, 255, 255, 0.04);
        border: none;
        color: var(--emp-muted);
    }

    .work-record-page .oh-card {
        background: rgba(22, 31, 24, 0.9);
        border: 1px solid var(--emp-border);
        border-radius: 14px;
        padding: 12px 16px;
        margin-bottom: 20px;
    }

    .work-record-page .oh-card h4,
    .work-record-page .oh-card h6,
    .work-record-page label {
        color: var(--emp-text);
    }

    .work-record-page .days {
        width: 30px;
    }

    .work-record-page #workRecordTable a {
        color: inherit;
    }

    .work-record-page .oh-sticky-table__th {
        padding: 5px !important;
        text-align: center;
    }

    .work-record-page .oh-dropdown__menu {
        background: var(--emp-surface-elevated);
        border: 1px solid var(--emp-border);
        box-shadow: 0 20px 45px rgba(1, 9, 5, 0.34);
    }

    .work-record-page .oh-btn,
    .work-record-page input {
        border-radius: 10px;
        border: 1px solid var(--emp-border);
        background: rgba(22, 31, 24, 0.85);
        color: var(--emp-text);
    }
</style>

<div class="oh-wrapper work-record-page">
    <div class="col-12 mt-4 mb-4">
        <div class="oh-card d-flex justify-content-between align-items-center">
            <div>
                <h4>{% trans "Work Records" %}</h4>
            </div>
            <div class="me-3" >
                <h6 class="mb-2 fw-bold">{% trans "Date:" %} {{ current_date }}</h6>
                <h6>
                    <div style = "cursor: pointer;display:flex;align-items:center">
                        <label for="monthYearField" class="text-danger fw-bold" style = "cursor: pointer;">{% trans "Month" %}</label>
                        <input class="oh-select p-2 w-75 m-1"
                        type="month"
                        id="monthYearField"
                        value="{{ current_date|date:"Y-m" }}"
                        name="month"
                        hx-get="{% url 'work-records-change-month' %}"
                        hx-target="#workRecordTable"
                        hx-trigger="change"
                        >
                    </div>
                </h6>
            </div>
        </div>
        <div id="workRecordTable" hx-get="{% url 'work-records-change-month' %}?month={{pd}}&{{ current_date|date:"Y-m" }}" hx-trigger="load">
            <div class="animated-background"></div>
        </div>
    </div>
</div>

{% endblock content %}
