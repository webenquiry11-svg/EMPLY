{% extends 'index.html' %}
{% block content %}
{% load i18n %}
{% load static %}

<style>
    .work-record-page {
        --work-record-ink: #173f50;
        --work-record-text: #315b69;
        --work-record-muted: #66818a;
        --work-record-teal: #176f80;
        --work-record-border: #d1e5e9;
        --work-record-soft: #f3f9fa;
        --work-record-status-present: #2f9e44;
        --work-record-status-half-day: #d6b800;
        --work-record-status-leave-present: #c65d0f;
        --work-record-status-leave: #6c757d;
        --work-record-status-absent: #6878d6;
        --work-record-status-conflict: #dc3545;
        color: var(--work-record-text);
    }

    html body .oh-wrapper-main.super-admin-panel-theme .work-record-page .work-record-head {
        min-height: 90px;
    }

    .work-record-page .work-record-head .oh-main__titlebar,
    .work-record-page .work-record-head .oh-main__titlebar--right {
        display: flex;
        min-width: 0;
        align-items: center;
        margin: 0 !important;
        border: 0 !important;
        background: transparent !important;
    }

    .work-record-page .work-record-head .oh-main__titlebar--right {
        justify-content: flex-end;
        gap: 18px;
    }

    .work-record-page .work-record-title {
        margin: 0;
        color: var(--work-record-ink);
        font-size: 1.25rem;
        font-weight: 750;
        line-height: 1.3;
    }

    .work-record-page .work-record-current-date {
        margin: 0;
        color: var(--work-record-muted);
        font-size: 0.82rem;
        font-weight: 600;
        white-space: nowrap;
    }

    .work-record-page .work-record-month-picker {
        display: flex;
        align-items: center;
        gap: 9px;
        margin: 0;
        color: var(--work-record-ink);
        font-size: 0.85rem;
        font-weight: 700;
        white-space: nowrap;
    }

    .work-record-page .work-record-month-picker input {
        box-sizing: border-box;
        width: 190px;
        min-height: 42px;
        margin: 0;
        padding: 0 12px;
        border: 1px solid var(--work-record-border) !important;
        border-radius: 11px !important;
        background: #fff !important;
        color: var(--work-record-ink) !important;
        box-shadow: none;
    }

    .work-record-page .work-record-month-picker input:focus {
        border-color: var(--work-record-teal) !important;
        box-shadow: 0 0 0 3px rgba(23, 111, 128, 0.12);
        outline: 0;
    }

    .work-record-page .work-record-content {
        box-sizing: border-box;
        margin: 0 28px 32px !important;
        padding: 18px !important;
        border: 1px solid var(--work-record-border) !important;
        border-radius: 18px !important;
        background: #fff !important;
        box-shadow: 0 8px 22px rgba(10, 77, 96, 0.07);
    }

    .work-record-page #workRecordTable {
        min-width: 0;
    }

    .work-record-page #workRecordTable > .d-flex {
        align-items: center;
        gap: 14px;
        margin: 0 0 14px !important;
        padding: 0 0 14px;
        border-bottom: 1px solid #e4eff1;
    }

    .work-record-page #workRecordTable > .d-flex > .d-flex:first-child {
        align-items: center;
        gap: 8px;
    }

    .work-record-page #workRecordTable .oh-btn {
        display: inline-flex;
        min-height: 40px;
        align-items: center;
        justify-content: center;
        gap: 7px;
        margin: 0 !important;
        padding: 0 14px !important;
        border: 1px solid var(--work-record-teal) !important;
        border-radius: 10px !important;
        background: linear-gradient(135deg, #0a596b, #177f91) !important;
        box-shadow: 0 4px 11px rgba(10, 77, 96, 0.12);
        color: #fff !important;
        font-size: 0.82rem;
        font-weight: 700;
        line-height: 1.2;
        white-space: nowrap;
    }

    .work-record-page #workRecordTable .oh-btn:hover,
    .work-record-page #workRecordTable .oh-btn:focus-visible {
        border-color: #0a4d60 !important;
        background: #0a4d60 !important;
        color: #fff !important;
        outline: 0;
        box-shadow: 0 0 0 3px rgba(23, 111, 128, 0.14);
    }

    .work-record-page #workRecordTable .oh-btn ion-icon {
        flex: 0 0 auto;
        color: inherit !important;
        font-size: 17px;
    }

    .work-record-page #workRecordTable .oh-dropdown {
        position: relative;
    }

    .work-record-page #workRecordTable .oh-dropdown__menu {
        z-index: 1100;
        max-width: min(520px, calc(100vw - 32px));
        border: 1px solid var(--work-record-border) !important;
        border-radius: 14px !important;
        background: #fff !important;
        color: var(--work-record-text) !important;
        box-shadow: 0 16px 38px rgba(23, 63, 80, 0.18) !important;
    }

    .work-record-page #workRecordTable .oh-dropdown__menu .oh-label {
        color: var(--work-record-ink) !important;
        font-weight: 650;
    }

    .work-record-page #workRecordTable .oh-dropdown__menu input,
    .work-record-page #workRecordTable .oh-dropdown__menu select {
        min-height: 40px;
        border: 1px solid var(--work-record-border) !important;
        border-radius: 9px !important;
        background: #fff !important;
        color: var(--work-record-ink) !important;
    }

    .work-record-page #workRecordTable .oh-dropdown__menu .oh-dropdown__link {
        color: var(--work-record-text) !important;
    }

    .work-record-page #workRecordTable .oh-dropdown__menu .oh-dropdown__link:hover {
        border-radius: 7px;
        background: #eaf5f7 !important;
        color: var(--work-record-teal) !important;
    }

    .work-record-page .work-record-legend {
        display: flex;
        min-width: 0;
        align-items: center;
        justify-content: flex-end;
        flex-wrap: wrap;
        gap: 8px 16px;
        margin: 0 !important;
        color: var(--work-record-text);
        font-size: 0.77rem;
        font-weight: 600;
    }

    .work-record-page .work-record-legend__item {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin: 0 !important;
        white-space: nowrap;
    }

    .work-record-page .work-record-legend__item .oh-dot {
        width: 9px;
        height: 9px;
        margin: 0 !important;
        border-radius: 50%;
        box-shadow: 0 0 0 3px rgba(23, 63, 80, 0.06);
    }

    .work-record-page .work-record-legend__dot--present,
    .work-record-page #workRecordTable tbody td.days.work-record-cell--present {
        background: var(--work-record-status-present) !important;
        color: #fff !important;
    }

    .work-record-page .work-record-legend__dot--half-day,
    .work-record-page #workRecordTable tbody td.days.work-record-cell--half-day {
        background: var(--work-record-status-half-day) !important;
        color: #302800 !important;
    }

    .work-record-page .work-record-legend__dot--leave-present,
    .work-record-page #workRecordTable tbody td.days.work-record-cell--leave-present {
        background: var(--work-record-status-leave-present) !important;
        color: #fff !important;
    }

    .work-record-page .work-record-legend__dot--leave,
    .work-record-page #workRecordTable tbody td.days.work-record-cell--leave {
        background: var(--work-record-status-leave) !important;
        color: #fff !important;
    }

    .work-record-page .work-record-legend__dot--absent,
    .work-record-page #workRecordTable tbody td.days.work-record-cell--absent {
        background: var(--work-record-status-absent) !important;
        color: #fff !important;
    }

    .work-record-page .work-record-legend__dot--conflict,
    .work-record-page #workRecordTable tbody td.days.work-record-cell--conflict {
        background: var(--work-record-status-conflict) !important;
        color: #fff !important;
    }

    .work-record-page #workRecordTable .oh-sticky-table {
        max-width: 100%;
        overflow: auto;
        border: 1px solid var(--work-record-border) !important;
        border-radius: 13px !important;
        background: #fff !important;
        box-shadow: 0 4px 14px rgba(10, 77, 96, 0.05);
        scrollbar-color: #9fc6ce #edf5f6;
        scrollbar-width: thin;
    }

    .work-record-page #workRecordTable table {
        width: max-content;
        min-width: 100%;
        margin: 0;
        border-collapse: separate;
        border-spacing: 0;
        background: #fff;
    }

    .work-record-page #workRecordTable thead th {
        position: sticky;
        top: 0;
        z-index: 2;
        height: 42px;
        min-width: 38px;
        padding: 8px 6px !important;
        border: 0 !important;
        border-right: 1px solid #d8e9ec !important;
        border-bottom: 1px solid #d8e9ec !important;
        background: #eaf5f7 !important;
        color: var(--work-record-ink) !important;
        font-size: 0.77rem;
        font-weight: 750;
        line-height: 1.2;
        text-align: center;
    }

    .work-record-page #workRecordTable thead th:first-child {
        position: sticky;
        left: 0;
        z-index: 4;
        min-width: 170px;
        text-align: left;
    }

    .work-record-page #workRecordTable thead th.holiday {
        background: #f3f6f7 !important;
        color: var(--work-record-muted) !important;
    }

    .work-record-page #workRecordTable tbody tr {
        transition: background-color 0.16s ease;
    }

    .work-record-page #workRecordTable tbody tr:hover {
        background: #f1f8f9;
    }

    .work-record-page #workRecordTable tbody td {
        height: 40px;
        min-width: 38px;
        padding: 6px !important;
        border: 0 !important;
        border-right: 1px solid rgba(255, 255, 255, 0.65) !important;
        border-bottom: 1px solid var(--work-record-border) !important;
        color: var(--work-record-ink);
        font-size: 0.76rem;
        line-height: 1.25;
        text-align: center;
        vertical-align: middle;
    }

    .work-record-page #workRecordTable tbody tr:nth-child(even) td:not(.days),
    .work-record-page #workRecordTable tbody tr:nth-child(even) td.days:not([class*="work-record-cell--"]) {
        background-color: #f7fbfc;
    }

    .work-record-page #workRecordTable tbody td:first-child {
        position: sticky;
        left: 0;
        z-index: 1;
        min-width: 170px;
        background: #fff !important;
        text-align: left;
    }

    .work-record-page #workRecordTable tbody tr:nth-child(even) td:first-child {
        background: #f7fbfc !important;
    }

    .work-record-page #workRecordTable tbody tr:hover td:first-child {
        background: #f1f8f9 !important;
    }

    .work-record-page #workRecordTable tbody td:first-child a {
        color: var(--work-record-teal) !important;
        font-weight: 650;
        text-decoration: none;
    }

    .work-record-page #workRecordTable tbody td:first-child a:hover {
        color: var(--work-record-ink) !important;
        text-decoration: underline;
        text-underline-offset: 2px;
    }

    .work-record-page #workRecordTable tbody td.days {
        min-width: 38px;
        font-weight: 700;
        transition: filter 0.16s ease, box-shadow 0.16s ease;
    }

    .work-record-page #workRecordTable tbody td.days:hover {
        filter: brightness(0.94);
        box-shadow: inset 0 0 0 2px rgba(23, 63, 80, 0.14);
    }

    .work-record-page #workRecordTable tbody td.days.holiday:not([style*="background-color"]) {
        background: #f0f4f5 !important;
    }

    .work-record-page #workRecordTable tbody td.days[class*="work-record-cell--"] a {
        color: inherit !important;
    }

    .work-record-page #workRecordTable .oh-pagination {
        box-sizing: border-box;
        min-height: 68px;
        gap: 12px 20px;
        margin: 14px 0 0 !important;
        padding: 12px 16px !important;
        border: 1px solid var(--work-record-border) !important;
        border-radius: 13px !important;
        background: #fff !important;
        color: var(--work-record-text) !important;
        box-shadow: 0 4px 12px rgba(10, 77, 96, 0.05);
    }

    .work-record-page #workRecordTable .oh-pagination__page,
    .work-record-page #workRecordTable .oh-pagination__label {
        color: var(--work-record-text) !important;
        font-size: 0.82rem;
        font-weight: 600;
    }

    .work-record-page #workRecordTable .oh-pagination__nav,
    .work-record-page #workRecordTable .oh-pagination__input-container,
    .work-record-page #workRecordTable .oh-pagination__items {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
    }

    .work-record-page #workRecordTable .oh-pagination__nav:hover,
    .work-record-page #workRecordTable .oh-pagination__label:hover {
        background: transparent !important;
        color: var(--work-record-text) !important;
    }

    .work-record-page #workRecordTable .oh-pagination__input-container {
        margin: 0 !important;
        padding: 4px 8px;
        border: 1px solid transparent;
        border-radius: 10px;
        transition: border-color 0.18s ease, background-color 0.18s ease, box-shadow 0.18s ease;
    }

    .work-record-page #workRecordTable .oh-pagination__input-container:hover,
    .work-record-page #workRecordTable .oh-pagination__input-container:focus-within {
        border-color: var(--work-record-border);
        background: var(--work-record-soft);
        box-shadow: 0 3px 10px rgba(10, 77, 96, 0.07);
    }

    .work-record-page #workRecordTable .oh-pagination__input {
        box-sizing: border-box;
        width: 58px;
        min-height: 36px;
        border: 1px solid var(--work-record-border) !important;
        border-radius: 9px !important;
        background: #fff !important;
        color: var(--work-record-ink) !important;
        text-align: center;
    }

    .work-record-page #workRecordTable .oh-pagination__input:hover,
    .work-record-page #workRecordTable .oh-pagination__input:focus {
        border-color: var(--work-record-teal) !important;
        box-shadow: 0 0 0 3px rgba(23, 111, 128, 0.12);
        outline: 0;
    }

    .work-record-page #workRecordTable .oh-pagination__items {
        margin: 0;
        padding: 0;
        list-style: none;
    }

    .work-record-page #workRecordTable .oh-pagination__item {
        display: inline-flex;
        width: auto;
        min-width: 38px;
        min-height: 38px;
        align-items: center;
        justify-content: center;
        padding: 0 10px;
        border: 1px solid var(--work-record-border) !important;
        border-radius: 9px !important;
        background: var(--work-record-soft) !important;
        color: var(--work-record-teal) !important;
        transition: border-color 0.18s ease, background-color 0.18s ease, color 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease;
    }

    .work-record-page #workRecordTable .oh-pagination__item:hover,
    .work-record-page #workRecordTable .oh-pagination__item:focus-within {
        transform: translateY(-1px);
        border-color: var(--work-record-teal) !important;
        background: var(--work-record-teal) !important;
        color: #fff !important;
        box-shadow: 0 4px 10px rgba(23, 111, 128, 0.18);
    }

    .work-record-page #workRecordTable .oh-pagination__link {
        display: inline-flex;
        min-height: 36px;
        align-items: center;
        color: inherit !important;
        text-decoration: none;
    }

    @media (max-width: 900px) {
        .work-record-page .work-record-head .oh-main__titlebar--right {
            justify-content: space-between;
        }

        .work-record-page .work-record-current-date {
            display: none;
        }

        .work-record-page .work-record-content {
            margin: 0 18px 24px !important;
            padding: 14px !important;
        }

        .work-record-page .work-record-legend {
            justify-content: flex-start;
        }
    }

    @media (max-width: 640px) {
        .work-record-page .work-record-head {
            margin: 14px 12px !important;
            padding: 16px !important;
        }

        .work-record-page .work-record-head .oh-main__titlebar--right {
            justify-content: flex-start;
        }

        .work-record-page .work-record-title {
            font-size: 1.05rem;
        }

        .work-record-page .work-record-month-picker {
            width: 100%;
            justify-content: space-between;
        }

        .work-record-page .work-record-month-picker input {
            width: min(190px, 68%);
        }

        .work-record-page .work-record-content {
            margin: 0 12px 130px !important;
            padding: 12px !important;
            border-radius: 14px !important;
        }

        .work-record-page #workRecordTable > .d-flex {
            align-items: stretch;
            flex-direction: column;
        }

        .work-record-page #workRecordTable > .d-flex > .d-flex:first-child {
            flex-wrap: wrap;
        }

        .work-record-page #workRecordTable .work-record-legend {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            justify-content: flex-start;
            gap: 9px 12px;
            font-size: 0.72rem;
        }

        .work-record-page #workRecordTable table {
            min-width: 1120px;
        }

        .work-record-page #workRecordTable thead th:first-child,
        .work-record-page #workRecordTable tbody td:first-child {
            min-width: 145px;
        }

        .work-record-page #workRecordTable .oh-pagination {
            align-items: flex-start;
            flex-direction: column;
            padding: 12px !important;
        }

        .work-record-page #workRecordTable .oh-pagination__nav {
            width: 100%;
            justify-content: space-between;
        }
    }
</style>

<div class="work-record-page">
    <section class="oh-wrapper oh-main__topbar employee-subsection-head work-record-head">
        <div class="oh-main__titlebar oh-main__titlebar--left">
            <h1 class="work-record-title">{% trans "Work Records" %}</h1>
        </div>
        <div class="oh-main__titlebar oh-main__titlebar--right">
            <p class="work-record-current-date">{% trans "Date:" %} {{ current_date }}</p>
            <label for="monthYearField" class="work-record-month-picker">
                <span>{% trans "Month" %}</span>
                <input
                    class="oh-select"
                    type="month"
                    id="monthYearField"
                    value="{{ current_date|date:"Y-m" }}"
                    name="month"
                    hx-get="{% url 'work-records-change-month' %}"
                    hx-target="#workRecordTable"
                    hx-trigger="change"
                >
            </label>
        </div>
    </section>
    <div
        class="oh-wrapper work-record-content"
        id="workRecordTable"
        hx-get="{% url 'work-records-change-month' %}?month={{pd}}&{{ current_date|date:"Y-m" }}"
        hx-trigger="load"
    >
        <div class="animated-background"></div>
    </div>
</div>

{% endblock content %}
