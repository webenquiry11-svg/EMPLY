{% load i18n %}{% load horillafilters %}
{% if messages %}
    <div class="oh-wrapper">
        {% for message in messages %}
            <div class="oh-alert-container">
                <div class="oh-alert oh-alert--animated {{message.tags}}">
                    {{ message }}
                </div>
            </div>
        {% endfor %}
        <script>
            $('.filterButton')[0].click();
            setTimeout(function () {
                $(".oh-modal__close").click();
            }, 1000);
        </script>
    </div>
{% endif %}
<div class="oh-modal__dialog-header">
    <span class="oh-modal__dialog-title" id="requestCreateModalLabel">{{ form.verbose_name }}</span>
    <button
        class="oh-modal__close"
        aria-label="{% trans 'Close' %}"
    >
        <ion-icon name="close-outline"></ion-icon>
    </button>
</div>
<form
    hx-post="{% url 'user-request' id %}?{{pd}}"
    hx-target="#objectCreateModalTarget"
    hx-encoding="multipart/form-data"
    id="userLeaveForm"
>
    <div class="oh-modal__dialog-body">{{ form.as_p }}</div>
</form>
<style>
    html body:has(.oh-wrapper-main.employee-bottom-nav-active) #objectCreateModal #userLeaveForm .select2-selection,
    html body:has(.oh-wrapper-main.employee-bottom-nav-active) #objectCreateModal #userLeaveForm .select2-selection--single {
        min-height: 46px !important;
        padding: 0 !important;
        background: #ffffff !important;
        border: 1px solid rgba(42, 132, 155, 0.24) !important;
        border-radius: 12px !important;
        color: #285d6b !important;
        box-shadow: none !important;
    }

    html body:has(.oh-wrapper-main.employee-bottom-nav-active) #objectCreateModal #userLeaveForm .select2-selection__rendered {
        padding: 0.78rem 2.4rem 0.78rem 0.9rem !important;
        color: #285d6b !important;
        line-height: 1.2 !important;
    }

    html body:has(.oh-wrapper-main.employee-bottom-nav-active) #objectCreateModal #userLeaveForm .select2-container--open .select2-selection,
    html body:has(.oh-wrapper-main.employee-bottom-nav-active) #objectCreateModal #userLeaveForm .select2-container--focus .select2-selection {
        border-color: #278da0 !important;
        box-shadow: 0 0 0 3px rgba(39, 141, 160, 0.16) !important;
    }

    html body:has(.oh-wrapper-main.employee-bottom-nav-active) > .select2-container .select2-search__field {
        border: 1px solid rgba(42, 132, 155, 0.26) !important;
        border-color: rgba(42, 132, 155, 0.26) !important;
        background: #ffffff !important;
        color: #285d6b !important;
    }

    html body:has(.oh-wrapper-main.employee-bottom-nav-active) > .select2-container .select2-results__option {
        background: #ffffff !important;
        color: #285d6b !important;
        border-radius: 9px !important;
    }

    html body:has(.oh-wrapper-main.employee-bottom-nav-active) > .select2-container .select2-results__option--highlighted,
    html body:has(.oh-wrapper-main.employee-bottom-nav-active) > .select2-container .select2-results__option[aria-selected="true"] {
        background: linear-gradient(110deg, #0a4d60, #278da0) !important;
        color: #ffffff !important;
    }
</style>
<script>
   (function () {
       var minuteLeaveTypeIds = {{ minute_leave_type_ids|default:'[]'|safe }};

       function toggleMinuteFields() {
           var selectedLeaveType = $("#userLeaveForm [name='leave_type_id']").val();
           var isMinuteLeave = minuteLeaveTypeIds.includes(Number(selectedLeaveType));

           $("#id_requested_minutes_parent_div").toggle(isMinuteLeave);
           $("#id_end_date_parent_div").toggle(!isMinuteLeave);
           $("#id_start_date_breakdown_parent_div").toggle(!isMinuteLeave);
           $("#id_end_date_breakdown_parent_div").toggle(!isMinuteLeave);
       }

       $(document).ready(function () {
           $("#userLeaveForm [name='leave_type_id']").on("change", toggleMinuteFields);
           toggleMinuteFields();
       });
   })();
</script>

{% if "recruitment"|app_installed %}
    <script>
        $("#userLeaveForm [type=submit]").hide();
        var button = `
        <div class="oh-modal__dialog-footer p-0 mt-3">
        <button id="buttonID" class="oh-btn oh-btn--secondary oh-btn--shadow">
            Save
        </button>
        </div>
        `;
        $("#userLeaveForm .row").after(button);

        $(document).ready(function () {
            $("#buttonID").on("click", function () {
                event.preventDefault();
                event.stopPropagation();
                var startDate = $("#userLeaveForm [name = start_date]").val();
                var endDate = $("#userLeaveForm [name = end_date]").val();
                var employee = "{{request.user.employee_get.id}}";

                $.ajax({
                    type: "GET",
                    url: "{% url 'check-interview-conflicts' %}",
                    data: {
                        start_date: startDate,
                        end_date: endDate,
                        employee_id: employee,
                    },
                    success: function (response) {
                        var interviews = response.interviews;

                        title="{% trans 'Leave Request Alert.' %}";
                        var content = `<div>
                <p>{{request.user.employee_get}} has interview in the requested date.</p>
                <ol style="margin-left:5%">`;
                        interviews.forEach(function (interview, index) {
                            content += `<li style="text-align:left; font-size:14px">${interview}</li>`;
                        });
                        content += `</ol>
                <p style="font-weight:700">{% trans "Are you sure you want to proceed with the request?" %}</p>
            </div>`;

                        if (interviews.length != 0) {
                            Swal.fire({
                                title: title,
                                icon: "info",
                                html: content,
                                showCancelButton: true,
                                confirmButtonColor: "#008000",
                                cancelButtonColor: "#d33",
                                confirmButtonText: "Confirm",
                            }).then(function (result) {
                                if (result.isConfirmed) {
                                    $("#userLeaveForm [type=submit]").show();
                                    $("#buttonID").hide();
                                    $("#userLeaveForm [type=submit]").click();
                                }
                            });
                        } else {
                            $("#userLeaveForm [type=submit]").click();
                        }
                    },
                });
            });
        });
    </script>
{% endif %}
